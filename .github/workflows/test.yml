name: Validate toolkit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audio-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12,<1'
      - run: python -m unittest discover -s tests -p test_audio.py -v
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/lesson.py examples/quickstart.json
      - run: python scripts/lesson.py examples/studio-pt-en.json
      - name: Validate examples against JSON Schema
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python -c "import json,jsonschema,pathlib; schema=json.load(open('lesson.schema.json')); [jsonschema.Draft202012Validator(schema).validate(json.loads(p.read_text())) for p in pathlib.Path('examples').glob('*.json')]"
